plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nudge.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nudge.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
